services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelsphere_web
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=travelsphere_secret
      - DB_NAME=travel_db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: travelsphere_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: travelsphere_secret
      MYSQL_DATABASE: travel_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 5s

volumes:
  db_data:
    driver: local
