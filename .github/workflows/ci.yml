name: TravelSphere CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: travel_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup MySQL Database Schema
        run: |
          mysql -h 127.0.0.1 -u root travel_db < database/schema.sql
          mysql -h 127.0.0.1 -u root travel_db < database/seed.sql

      - name: Code Quality & Static Analysis (ESLint)
        run: npm run lint

      - name: Execute Automated Test Suite
        run: npm test

      - name: Production Bundle Compilation
        run: npm run build
